name: Convert images to WebP

on:
  push:
    paths:
      - 'images/*.jpg'
      - 'images/*.JPG'
      - 'images/*.jpeg'
      - 'images/*.png'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install webp tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert images to WebP
        run: |
          shopt -s nullglob nocaseglob globstar
          for file in images/**/*.jpg images/**/*.jpeg images/**/*.png; do
            [ -f "$file" ] || continue
            target="${file%.*}.webp"
            case "${file,,}" in
              *.png) cwebp -lossless "$file" -o "$target" ;;
              *)     cwebp -q 80 "$file" -o "$target" ;;
            esac
            rm -f "$file"
            echo "Converted $file -> $target"
          done
        shell: bash

      - name: Commit and push WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: convert images to WebP [skip ci]"
          git push
